# References:
#   U-Boot:
#     - https://u-boot.readthedocs.io/en/latest
#   Broadcom/RaspberryPi
#     - https://github.com/u-boot/u-boot/blob/master/doc/board/broadcom/raspberrypi.rst
#
# Two independent u-boot builds are produced:
#
#   rpi_generic - Pi 1-4 and CM4, built from {{ .uboot_version }} with the
#                 NVMe/xHCI patches in patches/.
#   rpi_5       - Pi 5 (BCM2712), built from {{ .uboot_rpi5_version }} with
#                 the BCM2712/RP1 patches in patches-rpi5/.
#
# They are kept on separate u-boot releases on purpose. The Pi 5 series
# needs a release carrying upstream's brcmstb PCIe and reset drivers,
# while the rpi_generic NVMe patches do not apply to that release yet.
# Splitting them means a Pi 5 change cannot regress Pi 1-4.
name: u-boot
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://ftp.denx.de/pub/u-boot/u-boot-{{ .uboot_version }}.tar.bz2
        destination: u-boot.tar.bz2
        sha256: "{{ .uboot_sha256 }}"
        sha512: "{{ .uboot_sha512 }}"
      - url: https://ftp.denx.de/pub/u-boot/u-boot-{{ .uboot_rpi5_version }}.tar.bz2
        destination: u-boot-rpi5.tar.bz2
        sha256: "{{ .uboot_rpi5_sha256 }}"
        sha512: "{{ .uboot_rpi5_sha512 }}"
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      # rpi_generic (built with rpi_arm64_defconfig, which "uses the device-tree provided by the firmware")
      - |
        set -e
        mkdir -p rpi_generic
        tar xf u-boot.tar.bz2 -C rpi_generic --strip-components=1
        cd rpi_generic
        patch -p1 < /pkg/patches/0002-rpi-add-NVMe-to-boot-order.patch
        patch -p1 < /pkg/patches/0003-Revert-nvme-Correct-the-prps-per-page-calculation-me.patch
        patch -p1 < /pkg/patches/0004-usb-xhci-brcm-Make-driver-compatible-with-downstream.patch
        patch -p1 < /pkg/patches/0005-nvme-improve-readability-of-nvme_setup_prps.patch
        patch -p1 < /pkg/patches/0006-nvme-Use-pointer-for-CPU-addressed-buffers.patch
        patch -p1 < /pkg/patches/0007-nvme-translate-virtual-addresses-into-the-bus-s-addr.patch
        patch -p1 < /pkg/patches/0008-enable-nvme-and-fixup-efi-boot.patch

        make rpi_arm64_defconfig
      # rpi_5 (BCM2712 SoC and RP1 south bridge, also rpi_arm64_defconfig)
      - |
        set -e
        mkdir -p rpi_5
        tar xf u-boot-rpi5.tar.bz2 -C rpi_5 --strip-components=1
        cd rpi_5
        patch -p1 < /pkg/patches-rpi5/0001-arm-bcm283x-add-BCM2712-SoC-support.patch
        patch -p1 < /pkg/patches-rpi5/0002-pci-uclass-fix-ofnode-matching-for-RP1.patch
        patch -p1 < /pkg/patches-rpi5/0003-mfd-add-RP1-multi-function-device-driver.patch
        patch -p1 < /pkg/patches-rpi5/0004-clk-add-RP1-clock-driver.patch
        patch -p1 < /pkg/patches-rpi5/0005-gpio-add-RP1-GPIO-driver.patch
        patch -p1 < /pkg/patches-rpi5/0006-pinctrl-add-BCM2712-pinctrl-driver.patch
        patch -p1 < /pkg/patches-rpi5/0007-net-macb-add-RP1-ethernet-support.patch
        patch -p1 < /pkg/patches-rpi5/0008-nvme-use-virt-to-bus-address-translation.patch
        patch -p1 < /pkg/patches-rpi5/0009-core-fix-DMA-range-and-PCI-devfn-handling.patch
        patch -p1 < /pkg/patches-rpi5/0010-rpi-board-add-RP1-init-and-boot-config.patch
        patch -p1 < /pkg/patches-rpi5/0011-rpi-defconfig-enable-BCM2712-and-EFI-boot.patch

        make rpi_arm64_defconfig
    build:
      # rpi_generic
      - |
        set -e
        cd rpi_generic
        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto"
      # rpi_5
      - |
        set -e
        cd rpi_5
        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto"
    install:
      # rpi_generic
      - |
        set -e
        mkdir -p /rootfs/artifacts/arm64/u-boot/rpi_generic
        cp -v rpi_generic/u-boot.bin /rootfs/artifacts/arm64/u-boot/rpi_generic
      # rpi_5
      - |
        set -e
        mkdir -p /rootfs/artifacts/arm64/u-boot/rpi_5
        cp -v rpi_5/u-boot.bin /rootfs/artifacts/arm64/u-boot/rpi_5
finalize:
  - from: /rootfs
    to: /rootfs
