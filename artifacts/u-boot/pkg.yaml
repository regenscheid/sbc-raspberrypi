# References:
#   U-Boot:
#     - https://u-boot.readthedocs.io/en/latest
#   Broadcom/RaspberryPi
#     - https://github.com/u-boot/u-boot/blob/master/doc/board/broadcom/raspberrypi.rst
name: u-boot
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://ftp.denx.de/pub/u-boot/u-boot-{{ .uboot_version }}.tar.bz2
        destination: u-boot.tar.bz2
        sha256: "{{ .uboot_sha256 }}"
        sha512: "{{ .uboot_sha512 }}"
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      # Two independent source trees built from the same tarball:
      #   rpi_generic — existing Pi 1-4 NVMe/USB patches, unchanged.
      #   rpi_5       — BCM2712/RP1/PCIe patches imported from
      #                 siderolabs/sbc-raspberrypi#88. These supersede
      #                 the rpi_generic nvme/usb patches, so they are
      #                 applied to a clean source tree rather than on
      #                 top of the existing set.
      - |
        mkdir rpi_generic_src rpi_5_src
        tar xf u-boot.tar.bz2 -C rpi_generic_src --strip-components=1
        tar xf u-boot.tar.bz2 -C rpi_5_src --strip-components=1
      # rpi_generic (built with rpi_arm64_defconfig, which "uses the device-tree provided by the firmware")
      - |
        cd rpi_generic_src
        patch -p1 < /pkg/patches/0002-rpi-add-NVMe-to-boot-order.patch
        patch -p1 < /pkg/patches/0003-Revert-nvme-Correct-the-prps-per-page-calculation-me.patch
        patch -p1 < /pkg/patches/0004-usb-xhci-brcm-Make-driver-compatible-with-downstream.patch
        patch -p1 < /pkg/patches/0005-nvme-improve-readability-of-nvme_setup_prps.patch
        patch -p1 < /pkg/patches/0006-nvme-Use-pointer-for-CPU-addressed-buffers.patch
        patch -p1 < /pkg/patches/0007-nvme-translate-virtual-addresses-into-the-bus-s-addr.patch
        patch -p1 < /pkg/patches/0008-enable-nvme-and-fixup-efi-boot.patch

        make rpi_arm64_defconfig
      # rpi_5 (BCM2712 SoC + RP1 + PCIe + NVMe via virt-to-bus translation, from PR #88)
      - |
        cd rpi_5_src
        patch -p1 < /pkg/patches/0009-arm-bcm283x-add-BCM2712-SoC-support.patch
        patch -p1 < /pkg/patches/0010-arm-dts-add-bcm2712-rpi-5-b-support.patch
        patch -p1 < /pkg/patches/0011-pci-brcmstb-add-BCM2712-PCIe-controller-support.patch
        patch -p1 < /pkg/patches/0012-pci-uclass-fix-ofnode-matching-for-RP1.patch
        patch -p1 < /pkg/patches/0013-reset-add-Broadcom-brcmstb-reset-drivers.patch
        patch -p1 < /pkg/patches/0014-mfd-add-RP1-multi-function-device-driver.patch
        patch -p1 < /pkg/patches/0015-clk-add-RP1-clock-driver.patch
        patch -p1 < /pkg/patches/0016-gpio-add-RP1-GPIO-driver.patch
        patch -p1 < /pkg/patches/0017-pinctrl-add-BCM2712-pinctrl-driver.patch
        patch -p1 < /pkg/patches/0018-net-macb-add-RP1-ethernet-support.patch
        patch -p1 < /pkg/patches/0019-nvme-use-virt-to-bus-address-translation.patch
        patch -p1 < /pkg/patches/0020-core-fix-DMA-range-and-PCI-devfn-handling.patch
        patch -p1 < /pkg/patches/0021-rpi-board-add-RP1-init-and-boot-config.patch
        patch -p1 < /pkg/patches/0022-rpi-defconfig-enable-BCM2712-and-EFI-boot.patch

        make rpi_arm64_defconfig
    build:
      # rpi_generic
      - |
        cd rpi_generic_src
        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto"
      # rpi_5
      - |
        cd rpi_5_src
        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto"
    install:
      # rpi_generic
      - |
        mkdir -p /rootfs/artifacts/arm64/u-boot/rpi_generic
        cp -v rpi_generic_src/u-boot.bin /rootfs/artifacts/arm64/u-boot/rpi_generic
      # rpi_5
      - |
        mkdir -p /rootfs/artifacts/arm64/u-boot/rpi_5
        cp -v rpi_5_src/u-boot.bin /rootfs/artifacts/arm64/u-boot/rpi_5
finalize:
  - from: /rootfs
    to: /rootfs
